<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Apple Home Screen Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asset Scanner">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1976d2">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231976d2'/%3E%3Cpath d='M25 35h10v30H25zm15 0h6v30h-6zm10 0h14v30H50zm18 0h7v30h-7zm11 0h6v30h-6z' fill='white'/%3E%3C/svg%3E">

  <title>Asset Tag Scanner & Inventory Manager</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #0d47a1;
      --accent: #2e7d32;
      --danger: #c62828;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #cfd8dc;
      --text: #263238;
      --text-muted: #607d8b;
    }
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      margin: 0; 
      padding: calc(env(safe-area-inset-top, 16px) + 12px) calc(env(safe-area-inset-right, 16px) + 8px) calc(env(safe-area-inset-bottom, 16px) + 12px) calc(env(safe-area-inset-left, 16px) + 8px); 
      background-color: var(--bg); 
      color: var(--text); 
    }
    h1 { 
      margin: 0 0 12px 0; 
      font-size: 1.4rem; 
      color: var(--primary-dark); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge { 
      font-size: 0.85rem; 
      padding: 4px 10px; 
      background: #e3f2fd; 
      color: var(--primary-dark); 
      border-radius: 12px; 
      font-weight: normal; 
    }
    
    .card { 
      background: var(--card-bg); 
      border-radius: 8px; 
      padding: 14px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
      margin-bottom: 14px; 
      border: 1px solid var(--border); 
    }
    .grid-form { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 12px; 
      align-items: end; 
    }
    .form-group { 
      display: flex; 
      flex-direction: column; 
      gap: 4px; 
    }
    label { 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    input, select, button { 
      padding: 9px 12px; 
      border-radius: 6px; 
      border: 1px solid var(--border); 
      font-size: 0.95rem; 
    }
    input:focus, select:focus { 
      outline: none; 
      border-color: var(--primary); 
      box-shadow: 0 0 0 2px rgba(25,118,210,0.2); 
    }
    .scanner-field { 
      border: 2px solid var(--primary); 
      background: #fbfdff; 
      font-weight: bold; 
      letter-spacing: 1px; 
    }

    button { 
      cursor: pointer; 
      font-weight: 600; 
      transition: background 0.15s ease; 
      border: none; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #eceff1; color: #37474f; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #cfd8dc; }

    .actions-bar { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      align-items: center; 
      justify-content: space-between; 
    }
    .filter-group { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      flex: 1; 
      min-width: 280px; 
    }
    .btn-group { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
    }

    .mass-bar { 
      background: #fff8e1; 
      border: 1px dashed #ffb300; 
      padding: 10px; 
      border-radius: 6px; 
      margin-top: 10px; 
      display: none; 
      align-items: center; 
      gap: 8px; 
      flex-wrap: wrap; 
    }
    
    .table-container { 
      overflow-x: auto; 
      background: white; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      max-height: 520px; 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      min-width: 820px; 
      font-size: 0.9rem; 
    }
    th, td { 
      padding: 8px 10px; 
      text-align: left; 
      border-bottom: 1px solid #eef2f5; 
    }
    th { 
      background: #fafafa; 
      font-weight: 600; 
      color: #455a64; 
      position: sticky; 
      top: 0; 
      z-index: 2; 
      border-bottom: 2px solid var(--border); 
    }
    tr:hover { background-color: #f8fafc; }
    .editable-input { 
      width: 100%; 
      border: 1px solid transparent; 
      background: transparent; 
      padding: 4px; 
      font-size: 0.9rem; 
      border-radius: 4px; 
    }
    .editable-input:focus { 
      border: 1px solid var(--primary); 
      background: #ffffff; 
    }
    .row-action { 
      padding: 4px 8px; 
      font-size: 0.8rem; 
      border-radius: 4px; 
    }

    .status-msg { 
      font-size: 0.82rem; 
      font-weight: 500; 
      min-height: 18px; 
      margin-top: 4px; 
    }
    .status-ok { color: var(--accent); }
    .status-warn { color: #e65100; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #ffffff;
      border-radius: 10px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { margin: 0; font-size: 1.15rem; color: var(--primary-dark); }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }
    .loc-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 16px;
      align-items: end;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      .loc-add-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>
    <span>Asset Tag Scanner</span>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="btn-secondary" onclick="openLocationManager()" style="font-size:0.85rem; padding: 6px 12px;">Manage Rooms / Locations</button>
      <span class="badge" id="assetCount">0 Records</span>
    </div>
  </h1>

  <!-- Top Configuration & Scanner -->
  <div class="card">
    <div class="grid-form">
      <div class="form-group">
        <label for="roomSelect">1. Target Room (Lookup)</label>
        <select id="roomSelect" onchange="syncLocationDetails()">
          <option value="">-- Choose Room --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="teacherDisplay">Teacher</label>
        <input type="text" id="teacherDisplay" placeholder="Auto-filled" readonly style="background:#f5f5f5;">
      </div>

      <div class="form-group">
        <label for="classDisplay">Class</label>
        <input type="text" id="classDisplay" placeholder="Auto-filled" readonly style="background:#f5f5f5;">
      </div>

      <div class="form-group">
        <label for="cartAssetTag">2. Cart Asset Tag</label>
        <input type="text" id="cartAssetTag" placeholder="e.g. CART-01">
      </div>

      <div class="form-group">
        <label for="scanInput">3. Scan 6-Digit Asset Tag</label>
        <input type="text" id="scanInput" class="scanner-field" placeholder="Ready to scan..." autofocus autocomplete="off" inputmode="numeric">
      </div>

      <div class="form-group">
        <button class="btn-primary" onclick="handleScanSubmit()">Add / Record</button>
      </div>
    </div>
    <div id="scanFeedback" class="status-msg"></div>
  </div>

  <!-- Data Management Bar -->
  <div class="card">
    <div class="actions-bar">
      <div class="filter-group">
        <input type="text" id="searchInput" placeholder="Search Teacher or Room..." oninput="renderTable()" style="max-width: 240px;">
        <button class="btn-secondary" onclick="document.getElementById('searchInput').value=''; renderTable();">Clear</button>
      </div>
      <div class="btn-group">
        <button class="btn-secondary" onclick="exportData('csv')">Export CSV</button>
        <button class="btn-secondary" onclick="exportData('json')">Export JSON</button>
        <button class="btn-danger" onclick="deleteSelected()">Delete Selected</button>
      </div>
    </div>

    <!-- Mass Update Bar -->
    <div id="massUpdateBar" class="mass-bar">
      <strong>Mass Update (<span id="selectedCount">0</span> selected):</strong>
      <select id="massField" onchange="toggleMassInput()">
        <option value="room">Room, Teacher & Class</option>
        <option value="cart">Cart Asset Tag</option>
        <option value="notes">Notes</option>
      </select>
      <select id="massRoomVal" style="display:inline-block;"></select>
      <input type="text" id="massTextVal" placeholder="New value..." style="display:none; max-width:200px;">
      <button class="btn-primary" onclick="applyMassUpdate()">Apply</button>
    </div>
  </div>

  <!-- Main Repository Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 38px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this.checked)"></th>
          <th style="width: 110px;">Asset Tag</th>
          <th style="width: 90px;">Room No.</th>
          <th style="width: 160px;">Teacher</th>
          <th style="width: 110px;">Class</th>
          <th style="width: 130px;">Cart Asset Tag</th>
          <th>Notes</th>
          <th style="width: 70px; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="inventoryBody">
      </tbody>
    </table>
  </div>

  <!-- Modal: Location & Room Manager -->
  <div id="locationModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Manage Rooms & Locations Directory</h2>
        <button class="btn-secondary" onclick="closeLocationManager()" style="padding:4px 8px;">✕</button>
      </div>
      <div class="modal-body">
        <div class="loc-add-form">
          <div class="form-group">
            <label>Room No.</label>
            <input type="text" id="newRoomNo" placeholder="e.g. E411">
          </div>
          <div class="form-group">
            <label>Teacher</label>
            <input type="text" id="newTeacher" placeholder="Last, First">
          </div>
          <div class="form-group">
            <label>Class / Grade</label>
            <input type="text" id="newClass" placeholder="e.g. 4th Grade">
          </div>
          <button class="btn-success" onclick="addNewLocation()" style="height:38px;">+ Add Room</button>
        </div>

        <div style="max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px;">
          <table style="min-width: 100%;">
            <thead>
              <tr>
                <th style="width: 90px;">Room No.</th>
                <th>Teacher</th>
                <th style="width: 120px;">Class</th>
                <th style="width: 60px; text-align: center;">Delete</th>
              </tr>
            </thead>
            <tbody id="locationListBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-danger" onclick="resetLocationsToDefault()" style="font-size:0.8rem;">Reset to Default (ES - LOCATION)</button>
        <button class="btn-primary" onclick="closeLocationManager()">Done</button>
      </div>
    </div>
  </div>

<script>
// Default Spreadsheet Seed Dataset
const defaultLocationDirectory = [
  {"Room No.": "P209", "Class": "LAMPS", "Teacher": "Harris, Brittany"},
  {"Room No.": "E402", "Class": "4th Grade", "Teacher": "Carter, Cynthia"},
  {"Room No.": "E404", "Class": "4th Grade", "Teacher": "Amos, Heather"},
  {"Room No.": "E405", "Class": "4th Grade", "Teacher": "Gavenda, Elisa"},
  {"Room No.": "E406", "Class": "4th Grade", "Teacher": "Moore-Brown, Mellody"},
  {"Room No.": "E407", "Class": "4th Grade", "Teacher": "Spencer, Alliah"},
  {"Room No.": "E408", "Class": "4th Grade", "Teacher": "Cooper, Ava"},
  {"Room No.": "E409", "Class": "4th Grade", "Teacher": "Aldaco, Damaris"},
  {"Room No.": "E410", "Class": "4th Grade", "Teacher": "Coleman, Jasmine"},
  {"Room No.": "E500", "Class": "5th Grade", "Teacher": "Robledo, Rosa"},
  {"Room No.": "E502", "Class": "5th Grade", "Teacher": "Johnson, Pamela"},
  {"Room No.": "E504", "Class": "5th Grade", "Teacher": "Logan-Mumphrey, Renee"},
  {"Room No.": "E505", "Class": "5th Grade", "Teacher": "Owen, Efe"},
  {"Room No.": "E507", "Class": "5th Grade", "Teacher": "Rouse, Chevalia"},
  {"Room No.": "E507", "Class": "5th Grade", "Teacher": "Dewberry, Nicole"},
  {"Room No.": "E508", "Class": "5th Grade", "Teacher": "Williams, Lauren"},
  {"Room No.": "E509", "Class": "5th Grade", "Teacher": "Brown, Charlotte"},
  {"Room No.": "E510", "Class": "5th Grade", "Teacher": "Richard, Melissa"},
  {"Room No.": "E601", "Class": "3rd Grade", "Teacher": "Barrantes, Rosella"},
  {"Room No.": "E602", "Class": "3rd Grade", "Teacher": "Singleton, Tracy"},
  {"Room No.": "E603", "Class": "3rd Grade", "Teacher": "Lou, Ge"},
  {"Room No.": "E604", "Class": "3rd Grade", "Teacher": "Yaseen, Rebeka"},
  {"Room No.": "E607", "Class": "3rd Grade", "Teacher": "Bourque, Kennedy"},
  {"Room No.": "E608", "Class": "3rd Grade", "Teacher": "Roman, Daniel"},
  {"Room No.": "E609", "Class": "3rd Grade", "Teacher": "Pena, Ana"},
  {"Room No.": "E610", "Class": "3rd Grade", "Teacher": "Bernal, Kimberly"},
  {"Room No.": "K02", "Class": "2nd Grade", "Teacher": "Forero, Diana"},
  {"Room No.": "K04", "Class": "2nd Grade", "Teacher": "Fernandez, Alfonso"},
  {"Room No.": "K05", "Class": "2nd Grade", "Teacher": "Triche, Trichaad"},
  {"Room No.": "K06", "Class": "2nd Grade", "Teacher": "Cantu, Jessica"},
  {"Room No.": "K07", "Class": "2nd Grade", "Teacher": "Johnson, Desire"},
  {"Room No.": "K08", "Class": "2nd Grade", "Teacher": "Teague, Erin"},
  {"Room No.": "K09", "Class": "2nd Grade", "Teacher": "Haby, Shanna"},
  {"Room No.": "K10", "Class": "2nd Grade", "Teacher": "Moore-Lynch, Madison"},
  {"Room No.": "P102", "Class": "1st Grade", "Teacher": "Ogbone, Regina"},
  {"Room No.": "P103", "Class": "1st Grade", "Teacher": "Smith, Brittney"},
  {"Room No.": "P104", "Class": "1st Grade", "Teacher": "Pintado, Natalie"},
  {"Room No.": "P105", "Class": "1st Grade", "Teacher": "Wood, Brisa"},
  {"Room No.": "P106", "Class": "1st Grade", "Teacher": "Daniel, Emma"},
  {"Room No.": "P107", "Class": "1st Grade", "Teacher": "Marks, Alba"},
  {"Room No.": "P108", "Class": "1st Grade", "Teacher": "Johnson, Katelynn"},
  {"Room No.": "P109", "Class": "1st Grade", "Teacher": "Turner, Linda"}
];

let locationDirectory = JSON.parse(localStorage.getItem('es_location_directory')) || defaultLocationDirectory;
let inventory = JSON.parse(localStorage.getItem('es_asset_inventory') || '[]');
let selectedIndices = new Set();

function saveLocations() {
  localStorage.setItem('es_location_directory', JSON.stringify(locationDirectory));
  initDropdowns();
}

function initDropdowns() {
  const roomSelect = document.getElementById('roomSelect');
  const massRoomVal = document.getElementById('massRoomVal');
  const prevSelected = roomSelect.value;
  
  roomSelect.innerHTML = '<option value="">-- Choose Room / Teacher --</option>';
  massRoomVal.innerHTML = '<option value="">-- Choose New Room --</option>';

  locationDirectory.forEach((item, index) => {
    const label = `${item["Room No."]} - ${item["Teacher"]} (${item["Class"]})`;
    const opt1 = new Option(label, index);
    const opt2 = new Option(label, index);
    roomSelect.add(opt1);
    massRoomVal.add(opt2);
  });

  if (prevSelected && locationDirectory[prevSelected]) {
    roomSelect.value = prevSelected;
  }
}

function syncLocationDetails() {
  const selectedIndex = document.getElementById('roomSelect').value;
  if (selectedIndex !== "") {
    const item = locationDirectory[selectedIndex];
    document.getElementById('teacherDisplay').value = item["Teacher"];
    document.getElementById('classDisplay').value = item["Class"];
  } else {
    document.getElementById('teacherDisplay').value = "";
    document.getElementById('classDisplay').value = "";
  }
}

// Scanner Input Handling
const scanInput = document.getElementById('scanInput');
let scanTimer = null;

scanInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  if (/^\d{6}$/.test(val)) {
    clearTimeout(scanTimer);
    handleScanSubmit();
  }
});

scanInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleScanSubmit();
  }
});

function handleScanSubmit() {
  const rawTag = scanInput.value.trim();
  const roomIdx = document.getElementById('roomSelect').value;
  const cartTag = document.getElementById('cartAssetTag').value.trim();
  const feedback = document.getElementById('scanFeedback');

  if (!rawTag) {
    feedback.innerHTML = '<span class="status-warn">Scan input is empty.</span>';
    scanInput.focus();
    return;
  }

  if (roomIdx === "") {
    feedback.innerHTML = '<span class="status-warn">Please select a Room No. before scanning.</span>';
    scanInput.focus();
    return;
  }

  const loc = locationDirectory[roomIdx];
  const record = {
    id: Date.now() + Math.random().toString(),
    assetTag: rawTag,
    roomNo: loc["Room No."],
    teacher: loc["Teacher"],
    className: loc["Class"],
    cartAssetTag: cartTag,
    notes: ""
  };

  inventory.unshift(record);
  saveInventory();
  renderTable();

  feedback.innerHTML = `<span class="status-ok">Recorded Asset #${rawTag} &rarr; Room ${loc["Room No."]} (${loc["Teacher"]})</span>`;
  scanInput.value = '';
  scanInput.focus();
}

function saveInventory() {
  localStorage.setItem('es_asset_inventory', JSON.stringify(inventory));
  document.getElementById('assetCount').innerText = `${inventory.length} Records`;
}

function renderTable() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const tbody = document.getElementById('inventoryBody');
  tbody.innerHTML = '';

  const filtered = inventory.filter((item, index) => {
    item._origIndex = index;
    if (!query) return true;
    return (item.teacher && item.teacher.toLowerCase().includes(query)) ||
           (item.roomNo && item.roomNo.toLowerCase().includes(query)) ||
           (item.assetTag && item.assetTag.toLowerCase().includes(query));
  });

  filtered.forEach(item => {
    const idx = item._origIndex;
    const isChecked = selectedIndices.has(idx);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;"><input type="checkbox" onchange="toggleSelect(${idx}, this.checked)" ${isChecked ? 'checked' : ''}></td>
      <td><input class="editable-input" value="${escapeHtml(item.assetTag)}" onchange="updateRowField(${idx}, 'assetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.roomNo)}" onchange="updateRowField(${idx}, 'roomNo', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.teacher)}" onchange="updateRowField(${idx}, 'teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.className)}" onchange="updateRowField(${idx}, 'className', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.cartAssetTag)}" onchange="updateRowField(${idx}, 'cartAssetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.notes)}" placeholder="Tap to add notes..." onchange="updateRowField(${idx}, 'notes', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteRow(${idx})">Del</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateMassBar();
}

function updateRowField(index, field, value) {
  if (inventory[index]) {
    inventory[index][field] = value;
    saveInventory();
  }
}

function deleteRow(index) {
  inventory.splice(index, 1);
  selectedIndices.delete(index);
  saveInventory();
  renderTable();
}

function toggleSelect(index, isChecked) {
  if (isChecked) selectedIndices.add(index);
  else selectedIndices.delete(index);
  updateMassBar();
}

function toggleSelectAll(isChecked) {
  if (isChecked) {
    inventory.forEach((_, idx) => selectedIndices.add(idx));
  } else {
    selectedIndices.clear();
  }
  renderTable();
}

function updateMassBar() {
  const bar = document.getElementById('massUpdateBar');
  const countSpan = document.getElementById('selectedCount');
  countSpan.innerText = selectedIndices.size;
  bar.style.display = selectedIndices.size > 0 ? 'flex' : 'none';
  document.getElementById('selectAll').checked = (inventory.length > 0 && selectedIndices.size === inventory.length);
}

function toggleMassInput() {
  const field = document.getElementById('massField').value;
  document.getElementById('massRoomVal').style.display = field === 'room' ? 'inline-block' : 'none';
  document.getElementById('massTextVal').style.display = field !== 'room' ? 'inline-block' : 'none';
}

function applyMassUpdate() {
  const field = document.getElementById('massField').value;
  if (selectedIndices.size === 0) return;

  if (field === 'room') {
    const locIdx = document.getElementById('massRoomVal').value;
    if (locIdx === "") return;
    const loc = locationDirectory[locIdx];
    selectedIndices.forEach(idx => {
      inventory[idx].roomNo = loc["Room No."];
      inventory[idx].teacher = loc["Teacher"];
      inventory[idx].className = loc["Class"];
    });
  } else if (field === 'cart') {
    const val = document.getElementById('massTextVal').value;
    selectedIndices.forEach(idx => inventory[idx].cartAssetTag = val);
  } else if (field === 'notes') {
    const val = document.getElementById('massTextVal').value;
    selectedIndices.forEach(idx => inventory[idx].notes = val);
  }

  saveInventory();
  renderTable();
}

function deleteSelected() {
  if (selectedIndices.size === 0) return;
  if (!confirm(`Delete ${selectedIndices.size} selected row(s)?`)) return;
  inventory = inventory.filter((_, idx) => !selectedIndices.has(idx));
  selectedIndices.clear();
  saveInventory();
  renderTable();
}

/* Location Directory Management */
function openLocationManager() {
  renderLocationList();
  document.getElementById('locationModal').classList.add('active');
}

function closeLocationManager() {
  document.getElementById('locationModal').classList.remove('active');
  syncLocationDetails();
}

function renderLocationList() {
  const tbody = document.getElementById('locationListBody');
  tbody.innerHTML = '';
  locationDirectory.forEach((loc, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="editable-input" value="${escapeHtml(loc["Room No."])}" onchange="updateLocationField(${idx}, 'Room No.', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Teacher"])}" onchange="updateLocationField(${idx}, 'Teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Class"])}" onchange="updateLocationField(${idx}, 'Class', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteLocation(${idx})">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function addNewLocation() {
  const room = document.getElementById('newRoomNo').value.trim();
  const teacher = document.getElementById('newTeacher').value.trim();
  const cls = document.getElementById('newClass').value.trim();

  if (!room || !teacher) {
    alert("Please provide at least a Room No. and Teacher name.");
    return;
  }

  locationDirectory.unshift({
    "Room No.": room,
    "Teacher": teacher,
    "Class": cls || "General"
  });

  saveLocations();
  renderLocationList();

  document.getElementById('newRoomNo').value = '';
  document.getElementById('newTeacher').value = '';
  document.getElementById('newClass').value = '';
}

function updateLocationField(index, field, value) {
  if (locationDirectory[index]) {
    locationDirectory[index][field] = value;
    saveLocations();
  }
}

function deleteLocation(index) {
  if (confirm(`Remove room ${locationDirectory[index]["Room No."]} (${locationDirectory[index]["Teacher"]})?`)) {
    locationDirectory.splice(index, 1);
    saveLocations();
    renderLocationList();
  }
}

function resetLocationsToDefault() {
  if (confirm("Reset the location directory back to the original spreadsheet data? Any custom rooms you added will be removed.")) {
    locationDirectory = JSON.parse(JSON.stringify(defaultLocationDirectory));
    saveLocations();
    renderLocationList();
  }
}

function exportData(format) {
  if (inventory.length === 0) {
    alert("Repository is empty.");
    return;
  }

  let content = "";
  let filename = `asset_inventory_${new Date().toISOString().slice(0,10)}`;
  let mimeType = "";

  if (format === 'json') {
    content = JSON.stringify(inventory.map(({assetTag, roomNo, teacher, className, cartAssetTag, notes}) => ({
      "Asset Tag": assetTag,
      "Room No.": roomNo,
      "Teacher": teacher,
      "Class": className,
      "Cart Asset Tag": cartAssetTag,
      "Notes": notes
    })), null, 2);
    filename += ".json";
    mimeType = "application/json";
  } else {
    const headers = ["Asset Tag", "Room No.", "Teacher", "Class", "Cart Asset Tag", "Notes"];
    const rows = inventory.map(item => [
      `"${item.assetTag || ''}"`,
      `"${item.roomNo || ''}"`,
      `"${(item.teacher || '').replace(/"/g, '""')}"`,
      `"${(item.className || '').replace(/"/g, '""')}"`,
      `"${item.cartAssetTag || ''}"`,
      `"${(item.notes || '').replace(/"/g, '""')}"`
    ]);
    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    filename += ".csv";
    mimeType = "text/csv;charset=utf-8;";
  }

  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

window.onload = () => {
  initDropdowns();
  saveInventory();
  renderTable();
};
</script>
