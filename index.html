    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNBsRb9v9Mpk362Zoit0DaaChNXHgiJug",

      projectId: "maum-6b43c",

    try {

  <style>

<body>

  <h1>
    <span>Asset Tag Scanner</span>
    <div class="header-actions">
      <span class="sync-status" id="cloudStatus"><span class="sync-dot"></span> Connecting...</span>
      <button class="btn-secondary" onclick="loadIiqLocations()" style="font-size:0.85rem; padding: 0 12px; width: auto; height: 32px;">↻ Reload iiQ Locations</button>

  <!-- Top Configuration: Dynamic iiQ Campus & Room Selection -->
  <div class="card">
    <div class="grid-form">

<script>
const IIQ_WORKER_PROXY_URL = "https://incident6767.pandababble.workers.dev";

const IIQ_STATUS_LIST = [
  "In Service",
  "In Storage",
  "Broken",
  "Case Missing",
  "Charger Missing",
  "Dirty Case",
  "In for repairs",
  "Lost",
  "Missing",
  "Replaced with AppleCare+",
  "Retired",
  "Sold",
  "Stolen"
];

let iiqLocationsCache = {};
let inventory = [];
let selectedDocIds = new Set();
let isCloudReady = false;

window.addEventListener('firebase-error', (e) => {
  const statusEl = document.getElementById('cloudStatus');
  statusEl.className = 'sync-status error';
  statusEl.innerHTML = `<span class="sync-dot"></span> Init Error`;
  document.getElementById('scanFeedback').innerHTML = `<span class="status-warn">Firebase Error: ${e.detail}</span>`;
});

window.addEventListener('firebase-ready', () => {
  isCloudReady = true;
  const statusEl = document.getElementById('cloudStatus');

  const invCol = window.fs.collection(window.db, "inventory");
  window.fs.onSnapshot(invCol, (snapshot) => {
    statusEl.className = 'sync-status online';
    statusEl.innerHTML = '<span class="sync-dot"></span> Cloud Live';

    inventory = [];
    snapshot.forEach(docSnap => {
      inventory.push({ id: docSnap.id, ...docSnap.data() });
    });
    inventory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updateRoomFilterDropdown();
    renderTable();
  }, (err) => {
    statusEl.className = 'sync-status error';
    statusEl.innerHTML = '<span class="sync-dot"></span> Sync Blocked';
  });
});

async function loadIiqLocations() {
  const campusSelect = document.getElementById('campusSelect');
  const massCampusVal = document.getElementById('massCampusVal');
  campusSelect.innerHTML = '<option value="">Loading Campuses...</option>';

  try {
    const res = await fetch(IIQ_WORKER_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "getLocations" })
    });
    const data = await res.json();
    const locations = Array.isArray(data) ? data : (data.Items || data.items || []);

    campusSelect.innerHTML = '<option value="">-- Choose Location / Campus --</option>';
    massCampusVal.innerHTML = '<option value="">-- Choose Location / Campus --</option>';

    locations.forEach(loc => {
      const name = loc.Name || loc.LocationName;
      const id = loc.LocationId || loc.Id;
      campusSelect.add(new Option(name, id));
      massCampusVal.add(new Option(name, id));
    });

  } catch (e) {
    campusSelect.innerHTML = '<option value="">Error loading iiQ locations</option>';
    console.warn("Could not load iiQ locations:", e.message);
  }
}

async function onLocationChanged() {
  const locationId = document.getElementById('campusSelect').value;
  const roomSelect = document.getElementById('roomSelect');

  if (!locationId) {
    roomSelect.innerHTML = '<option value="">-- Choose Location First --</option>';
    return;
  }

  roomSelect.innerHTML = '<option value="">Loading Rooms...</option>';

  try {
    if (!iiqLocationsCache[locationId]) {
      const res = await fetch(IIQ_WORKER_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "getRooms", locationId: locationId })
      });
      const data = await res.json();
      iiqLocationsCache[locationId] = Array.isArray(data) ? data : (data.Items || data.items || []);
    }

    const rooms = iiqLocationsCache[locationId];
    roomSelect.innerHTML = '<option value="">-- Choose Room / Location --</option>';
    rooms.forEach(r => {
      const roomName = r.Name || r.RoomNumber || r.Number;
      const desc = r.Description ? ` (${r.Description})` : '';
      const roomId = r.RoomId || r.Id;
      roomSelect.add(new Option(`${roomName}${desc}`, roomId));
    });

  } catch (e) {
    roomSelect.innerHTML = '<option value="">Error loading rooms</option>';
    console.warn("Error loading rooms:", e.message);
  }
}

async function onMassLocationChanged() {
  const locationId = document.getElementById('massCampusVal').value;
  const roomSelect = document.getElementById('massRoomVal');

  if (!locationId) {
    roomSelect.innerHTML = '<option value="">-- Choose Location First --</option>';
    return;
  }

  roomSelect.innerHTML = '<option value="">Loading Rooms...</option>';

  if (!iiqLocationsCache[locationId]) {
    const res = await fetch(IIQ_WORKER_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "getRooms", locationId: locationId })
    });
    const data = await res.json();
    iiqLocationsCache[locationId] = Array.isArray(data) ? data : (data.Items || data.items || []);
  }

  const rooms = iiqLocationsCache[locationId];
  roomSelect.innerHTML = '<option value="">-- Choose Room --</option>';
  rooms.forEach(r => {
    const roomName = r.Name || r.RoomNumber || r.Number;
    const desc = r.Description ? ` (${r.Description})` : '';
    const roomId = r.RoomId || r.Id;
    roomSelect.add(new Option(`${roomName}${desc}`, roomId));
  });
}

function initStatusDropdowns() {
  const massStatusVal = document.getElementById('massStatusVal');
  massStatusVal.innerHTML = '<option value="">-- Choose Status --</option>';
  IIQ_STATUS_LIST.forEach(st => {
    massStatusVal.add(new Option(st, st));
  });
}

function updateRoomFilterDropdown() {
  const filterSelect = document.getElementById('filterRoomSelect');
  const currentVal = filterSelect.value;

  const roomCounts = {};
  inventory.forEach(item => {
    const r = (item.roomNo || "Unassigned").trim();
    roomCounts[r] = (roomCounts[r] || 0) + 1;
  });

  const sortedRooms = Object.keys(roomCounts).sort();
  filterSelect.innerHTML = '<option value="">All Rooms</option>';
  sortedRooms.forEach(room => {
    const opt = new Option(`${room} (${roomCounts[room]})`, room);
    filterSelect.add(opt);
  });

  if (sortedRooms.includes(currentVal)) {
    filterSelect.value = currentVal;
  }
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterRoomSelect').value = '';
  renderTable();
}

const scanInput = document.getElementById('scanInput');
let isProcessingScan = false;

scanInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    triggerScan();
  }
});

scanInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  if (/^\d{6}$/.test(val)) {
    triggerScan();
  }
});

function triggerScan() {
  if (isProcessingScan) return;
  isProcessingScan = true;
  handleScanSubmit().finally(() => {
    setTimeout(() => {
      isProcessingScan = false;
    }, 350);
  });
}

// Queries Incident IQ by tag or serial number
async function fetchIiqAssetDetails(query) {
  try {
    const payload = { action: "lookup" };
    if (query.assetTag) payload.assetTag = String(query.assetTag).trim();
    if (query.serialNumber) payload.serialNumber = String(query.serialNumber).trim();

    const res = await fetch(IIQ_WORKER_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) return null;
    const json = await res.json();

    if (json.Items && json.Items.length > 0) {
      const a = json.Items[0];
      return {
        assetId: a.AssetId || "",
        serialNumber: a.SerialNumber || "",
        model: a.ModelName || (a.Model && a.Model.Name) || "",
        status: (a.Status && a.Status.Name) || a.StatusName || "In Service"
      };
    }
  } catch (err) {
    console.warn("Worker proxy lookup error:", err.message);
  }
  return null;
}

async function handleScanSubmit() {
  const rawTag = scanInput.value.trim();
  const campusSel = document.getElementById('campusSelect');
  const roomSel = document.getElementById('roomSelect');
  const cartTag = document.getElementById('cartAssetTag').value.trim();
  const feedback = document.getElementById('scanFeedback');

  if (!rawTag) {
    feedback.innerHTML = '<span class="status-warn">Scan input is empty.</span>';
    scanInput.focus();
    return;
  }

  if (!campusSel.value || !roomSel.value) {
    feedback.innerHTML = '<span class="status-warn">Please select both a Campus and Room before scanning.</span>';
    scanInput.focus();
    return;
  }

  const campusName = campusSel.options[campusSel.selectedIndex].text;
  const roomName = roomSel.options[roomSel.selectedIndex].text;
  const locationId = campusSel.value;
  const roomId = roomSel.value;

  feedback.innerHTML = `<span>Querying Incident IQ for #${rawTag}...</span>`;

  const iiqData = await fetchIiqAssetDetails({ assetTag: rawTag });

  const newId = Date.now().toString() + "_" + rawTag;
  const foundAssetId = (iiqData && iiqData.assetId) ? iiqData.assetId : "";
  const foundSerial = (iiqData && iiqData.serialNumber) ? iiqData.serialNumber : "";
  const foundModel = (iiqData && iiqData.model) ? iiqData.model : "";
  const foundStatus = (iiqData && iiqData.status) ? iiqData.status : "In Service";

  const record = {
    assetId: foundAssetId,
    assetTag: rawTag,
    serialNumber: foundSerial,
    model: foundModel,
    status: foundStatus,
    campus: campusName,
    locationId: locationId,
    roomNo: roomName,
    roomId: roomId,
    cartAssetTag: cartTag,
    notes: "",
    timestamp: Date.now()
  };

  try {
    if (isCloudReady) {
      await window.fs.setDoc(window.fs.doc(window.db, "inventory", newId), record);
      const iiqInfo = foundSerial ? ` [S/N: ${foundSerial} | ${foundModel} (${foundStatus})]` : '';
      feedback.innerHTML = `<span class="status-ok">Recorded #${rawTag}${iiqInfo} &rarr; ${campusName} - ${roomName}</span>`;
    } else {
      feedback.innerHTML = `<span class="status-warn">Cloud not connected yet. Check network.</span>`;
    }
    scanInput.value = '';
    scanInput.focus();
  } catch (err) {
    feedback.innerHTML = `<span class="status-warn">Cloud write failed: ${err.message}</span>`;
  }
}

function getFilteredData() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const selectedRoomFilter = document.getElementById('filterRoomSelect').value.trim();

  return inventory.filter(item => {
    if (selectedRoomFilter && (item.roomNo || '').trim() !== selectedRoomFilter) {
      return false;
    }
    if (query) {
      const matchCampus = item.campus && item.campus.toLowerCase().includes(query);
      const matchRoom = item.roomNo && item.roomNo.toLowerCase().includes(query);
      const matchTag = item.assetTag && item.assetTag.toLowerCase().includes(query);
      const matchSerial = item.serialNumber && item.serialNumber.toLowerCase().includes(query);
      const matchModel = item.model && item.model.toLowerCase().includes(query);
      const matchStatus = item.status && item.status.toLowerCase().includes(query);
      const matchNotes = item.notes && item.notes.toLowerCase().includes(query);
      if (!matchCampus && !matchRoom && !matchTag && !matchSerial && !matchModel && !matchStatus && !matchNotes) return false;
    }
    return true;
  });
}

function renderTable() {
  const filtered = getFilteredData();
  const tbody = document.getElementById('inventoryBody');
  tbody.innerHTML = '';

  const selectedRoomFilter = document.getElementById('filterRoomSelect').value.trim();
  const query = document.getElementById('searchInput').value.trim();
  const countBadge = document.getElementById('assetCount');
  
  if (selectedRoomFilter || query) {
    countBadge.innerText = `${filtered.length} / ${inventory.length} Records`;
  } else {
    countBadge.innerText = `${inventory.length} Records`;
  }

  filtered.forEach(item => {
    const isChecked = selectedDocIds.has(item.id);
    const currentStatus = item.status || "In Service";
    
    let statusOptionsHtml = '';
    IIQ_STATUS_LIST.forEach(st => {
      const isSel = (st.toLowerCase() === currentStatus.toLowerCase()) ? 'selected' : '';
      statusOptionsHtml += `<option value="${escapeHtml(st)}" ${isSel}>${escapeHtml(st)}</option>`;
    });

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;"><input type="checkbox" onchange="toggleSelect('${item.id}', this.checked)" ${isChecked ? 'checked' : ''}></td>
      <td><input class="editable-input" value="${escapeHtml(item.assetTag)}" onchange="updateRowField('${item.id}', 'assetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.serialNumber || '')}" placeholder="--" onchange="updateRowField('${item.id}', 'serialNumber', this.value)"></td>
      <td><input class="editable-input" title="${escapeHtml(item.model || '')}" value="${escapeHtml(item.model || '')}" placeholder="--" onchange="updateRowField('${item.id}', 'model', this.value)"></td>
      <td>
        <select class="editable-select status-select" onchange="updateRowField('${item.id}', 'status', this.value)">
          ${statusOptionsHtml}
        </select>
      </td>
      <td><input class="editable-input" value="${escapeHtml(item.campus || '')}" onchange="updateRowField('${item.id}', 'campus', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.roomNo || '')}" onchange="updateRowField('${item.id}', 'roomNo', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.cartAssetTag || '')}" onchange="updateRowField('${item.id}', 'cartAssetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.notes || '')}" placeholder="Notes / sync info..." onchange="updateRowField('${item.id}', 'notes', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteRow('${item.id}')">Del</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateMassBar();
}

async function updateRowField(docId, field, value) {
  if (!isCloudReady) return;
  try {
    const docRef = window.fs.doc(window.db, "inventory", docId);
    await window.fs.updateDoc(docRef, { [field]: value });
  } catch (e) {
    document.getElementById('scanFeedback').innerHTML = `<span class="status-warn">Update failed: ${e.message}</span>`;
  }
}

async function deleteRow(docId) {
  if (!isCloudReady) return;
  try {
    await window.fs.deleteDoc(window.fs.doc(window.db, "inventory", docId));
    selectedDocIds.delete(docId);
  } catch (e) {
    document.getElementById('scanFeedback').innerHTML = `<span class="status-warn">Delete failed: ${e.message}</span>`;
  }
}

function toggleSelect(docId, isChecked) {
  if (isChecked) selectedDocIds.add(docId);
  else selectedDocIds.delete(docId);
  updateMassBar();
}

function toggleSelectAll(isChecked) {
  const currentItems = getFilteredData();
  if (isChecked) {
    currentItems.forEach(item => selectedDocIds.add(item.id));
  } else {
    currentItems.forEach(item => selectedDocIds.delete(item.id));
  }
  renderTable();
}

function updateMassBar() {
  const bar = document.getElementById('massUpdateBar');
  const countSpan = document.getElementById('selectedCount');
  countSpan.innerText = selectedDocIds.size;
  bar.style.display = selectedDocIds.size > 0 ? 'flex' : 'none';
  
  const currentItems = getFilteredData();
  document.getElementById('selectAll').checked = (currentItems.length > 0 && currentItems.every(i => selectedDocIds.has(i.id)));
}

function toggleMassInput() {
  const field = document.getElementById('massField').value;
  document.getElementById('massCampusVal').style.display = (field === 'location') ? 'inline-block' : 'none';
  document.getElementById('massRoomVal').style.display = (field === 'location') ? 'inline-block' : 'none';
  document.getElementById('massStatusVal').style.display = (field === 'status') ? 'inline-block' : 'none';
  document.getElementById('massTextVal').style.display = (field === 'cart' || field === 'notes') ? 'inline-block' : 'none';
}

async function applyMassUpdate() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  const field = document.getElementById('massField').value;
  const batch = window.fs.writeBatch(window.db);

  if (field === 'location') {
    const cSel = document.getElementById('massCampusVal');
    const rSel = document.getElementById('massRoomVal');
    if (!cSel.value || !rSel.value) {
      alert("Please choose both a Location and Room.");
      return;
    }
    const cName = cSel.options[cSel.selectedIndex].text;
    const rName = rSel.options[rSel.selectedIndex].text;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), {
        campus: cName,
        locationId: cSel.value,
        roomNo: rName,
        roomId: rSel.value
      });
    });
  } else if (field === 'status') {
    const val = document.getElementById('massStatusVal').value;
    if (!val) return;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { status: val });
    });
  } else if (field === 'cart') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { cartAssetTag: val });
    });
  } else if (field === 'notes') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { notes: val });
    });
  }

  await batch.commit();
}

// Auto-resolves missing AssetIds by serial number or asset tag
async function ensureAssetIdsLinked(records, btn) {
  const missing = records.filter(r => !r.assetId);
  if (missing.length === 0) return true;

  btn.innerText = `Linking ${missing.length} iiQ IDs...`;
  const batch = window.fs.writeBatch(window.db);
  let resolvedCount = 0;

  // Process concurrently in chunks of 8
  const chunkSize = 8;
  for (let i = 0; i < missing.length; i += chunkSize) {
    const chunk = missing.slice(i, i + chunkSize);
    await Promise.all(chunk.map(async (rec) => {
      const query = rec.serialNumber ? { serialNumber: rec.serialNumber } : { assetTag: rec.assetTag };
      const details = await fetchIiqAssetDetails(query);
      if (details && details.assetId) {
        rec.assetId = details.assetId;
        const ref = window.fs.doc(window.db, "inventory", rec.id);
        batch.update(ref, { assetId: details.assetId });
        resolvedCount++;
      }
    }));
  }

  if (resolvedCount > 0) {
    await batch.commit();
  }

  return records.some(r => r.assetId);
}

// Push to Incident IQ (Status or Location)
async function confirmAndPushSelectedToIiq() {
  if (selectedDocIds.size === 0) return;

  const mode = document.getElementById('massField').value;
  const selectedRecords = inventory.filter(item => selectedDocIds.has(item.id));
  const btn = document.getElementById('btnPushIiq');
  const prevBtnText = btn.innerText;

  btn.innerText = "Verifying IDs...";
  btn.disabled = true;

  try {
    // 1. Auto-link missing AssetIds
    await ensureAssetIdsLinked(selectedRecords, btn);

    const validRecords = selectedRecords.filter(r => Boolean(r.assetId));
    const validAssetIds = validRecords.map(r => r.assetId);

    if (validAssetIds.length === 0) {
      alert("Could not locate AssetIds for the selected items in Incident IQ. Check that serial numbers or asset tags match.");
      return;
    }

    if (mode === 'location') {
      const cSel = document.getElementById('massCampusVal');
      const rSel = document.getElementById('massRoomVal');

      if (!cSel.value || !rSel.value) {
        alert("Please select both a Location and Room under Mass Update.");
        return;
      }

      const cName = cSel.options[cSel.selectedIndex].text;
      const rName = rSel.options[rSel.selectedIndex].text;

      const confirmMsg = `Push ${validAssetIds.length} device(s) to Incident IQ with Location: "${cName} - ${rName}"?`;
      if (!confirm(confirmMsg)) return;

      btn.innerText = "Syncing to iiQ...";

      await fetch(IIQ_WORKER_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "bulkUpdateLocation",
          assetIds: validAssetIds,
          locationId: cSel.value,
          roomId: rSel.value
        })
      });

      const batch = window.fs.writeBatch(window.db);
      validRecords.forEach(rec => {
        const ref = window.fs.doc(window.db, "inventory", rec.id);
        const updatedNotes = rec.notes ? `${rec.notes} [Synced ${rName}]` : `[Synced ${rName}]`;
        batch.update(ref, { 
          campus: cName, 
          locationId: cSel.value, 
          roomNo: rName, 
          roomId: rSel.value, 
          notes: updatedNotes 
        });
      });
      await batch.commit();

      alert(`Successfully synced ${validAssetIds.length} asset(s) location to Incident IQ!`);

    } else if (mode === 'status') {
      const targetStatus = document.getElementById('massStatusVal').value || "In Service";
      const confirmMsg = `Push ${validAssetIds.length} device(s) to Incident IQ with Status: "${targetStatus}"?`;
      if (!confirm(confirmMsg)) return;

      btn.innerText = "Syncing to iiQ...";

      await fetch(IIQ_WORKER_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "bulkUpdateStatus",
          assetIds: validAssetIds,
          statusName: targetStatus
        })
      });

      const batch = window.fs.writeBatch(window.db);
      validRecords.forEach(rec => {
        const ref = window.fs.doc(window.db, "inventory", rec.id);
        const updatedNotes = rec.notes ? `${rec.notes} [Synced ${targetStatus}]` : `[Synced ${targetStatus}]`;
        batch.update(ref, { status: targetStatus, notes: updatedNotes });
      });
      await batch.commit();

      alert(`Successfully synced ${validAssetIds.length} asset(s) status to Incident IQ!`);
    } else {
      alert("Please set Mass Update to 'Location & Room' or 'Status' to push to Incident IQ.");
    }

  } catch (err) {
    alert(`iiQ Push Error: ${err.message}`);
  } finally {
    btn.innerText = prevBtnText;
    btn.disabled = false;
  }
}

async function deleteSelected() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  if (!confirm(`Delete ${selectedDocIds.size} selected record(s) from cloud?`)) return;

  const batch = window.fs.writeBatch(window.db);
  selectedDocIds.forEach(id => {
    batch.delete(window.fs.doc(window.db, "inventory", id));
  });
  await batch.commit();
  selectedDocIds.clear();
}

function exportData(format) {
  let targetData = [];
  if (selectedDocIds.size > 0) {
    targetData = inventory.filter(item => selectedDocIds.has(item.id));
  } else {
    targetData = getFilteredData();
  }

  if (targetData.length === 0) {
    alert("No records available to export.");
    return;
  }

  let content = "";
  let filename = `asset_scans_${new Date().toISOString().slice(0,10)}`;
  let mimeType = "";

  if (format === 'json') {
    content = JSON.stringify(targetData.map(({assetTag, serialNumber, model, status, campus, roomNo, cartAssetTag, notes}) => ({
      "Asset Tag": assetTag,
      "Serial Number": serialNumber || "",
      "Model": model || "",
      "Status": status || "In Service",
      "Campus": campus || "",
      "Room No.": roomNo || "",
      "Cart Asset Tag": cartAssetTag,
      "Notes": notes
    })), null, 2);
    filename += ".json";
    mimeType = "application/json";
  } else {
    const headers = ["Asset Tag", "Serial Number", "Model", "Status", "Campus", "Room No.", "Cart Asset Tag", "Notes"];
    const rows = targetData.map(item => [
      `"${item.assetTag || ''}"`,
      `"${item.serialNumber || ''}"`,
      `"${item.model || ''}"`,
      `"${item.status || 'In Service'}"`,
      `"${item.campus || ''}"`,
      `"${item.roomNo || ''}"`,
      `"${item.cartAssetTag || ''}"`,
      `"${(item.notes || '').replace(/"/g, '""')}"`
    ]);
    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    filename += ".csv";
    mimeType = "text/csv;charset=utf-8;";
  }

  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function makeTableResizable(table) {
  const row = table.querySelector('thead tr');
  if (!row) return;
  const cols = Array.from(row.children);

  cols.forEach((col) => {
    const resizer = col.querySelector('.resizer');
    if (!resizer) return;

    let startX = 0;
    let startWidth = 0;
    let tableStartWidth = 0;

    const onPointerDown = function (e) {
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      startWidth = col.getBoundingClientRect().width;
      tableStartWidth = table.getBoundingClientRect().width;

      resizer.classList.add('resizing');

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);

      e.preventDefault();
      e.stopPropagation();
    };

    const onPointerMove = function (e) {
      const currentX = e.clientX || (e.touches && e.touches[0].clientX);
      const diffX = currentX - startX;
      const newWidth = Math.max(60, startWidth + diffX);

      col.style.width = `${newWidth}px`;
      table.style.width = `${tableStartWidth + diffX}px`;
    };

    const onPointerUp = function () {
      resizer.classList.remove('resizing');
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    };

    resizer.addEventListener('pointerdown', onPointerDown);
  });
}

window.onload = () => {
  initStatusDropdowns();
  loadIiqLocations();
  const table = document.getElementById('inventoryTable');
  if (table) makeTableResizable(table);
};
