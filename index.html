    <div class="modal-card">

          <div class="form-group">

          </div>
          <button class="btn-success" onclick="addNewLocation()" style="height:38px;">+ Add Room</button>
        </div>

        <div style="max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px;">
          <table style="min-width: 100%;">

        <button class="btn-primary" onclick="closeLocationManager()">Done</button>

  {"Room No.": "P105", "Class": "1st Grade", "Teacher": "Wood, Brisa"},
  {"Room No.": "P106", "Class": "1st Grade", "Teacher": "Daniel, Emma"},
  {"Room No.": "P107", "Class": "1st Grade", "Teacher": "Marks, Alba"},

];

let locationDirectory = defaultLocationDirectory;
let inventory = [];
let selectedDocIds = new Set();
let isCloudReady = false;

// Connect to Firestore real-time listeners once script is ready
window.addEventListener('firebase-ready', () => {
  isCloudReady = true;
  document.getElementById('cloudStatus').innerHTML = '<span class="sync-dot"></span> Cloud Live';

  // 1. Listen for real-time inventory updates
  const invCol = window.fs.collection(window.db, "inventory");
  window.fs.onSnapshot(invCol, (snapshot) => {
    inventory = [];
    snapshot.forEach(docSnap => {
      inventory.push({ id: docSnap.id, ...docSnap.data() });
    });
    // Sort newest scans to top
    inventory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    document.getElementById('assetCount').innerText = `${inventory.length} Records`;
    renderTable();
  }, (err) => {
    console.warn("Firestore inv sync:", err);
  });

  // 2. Listen for real-time locations directory
  const locDoc = window.fs.doc(window.db, "config", "locations");
  window.fs.onSnapshot(locDoc, (docSnap) => {
    if (docSnap.exists() && Array.isArray(docSnap.data().list)) {
      locationDirectory = docSnap.data().list;
    } else {
      // First run: seed Firestore with default spreadsheet directory
      window.fs.setDoc(locDoc, { list: defaultLocationDirectory });
      locationDirectory = defaultLocationDirectory;
    }
    initDropdowns();
    renderLocationList();
  });
});

function initDropdowns() {
  const roomSelect = document.getElementById('roomSelect');
  const massRoomVal = document.getElementById('massRoomVal');
  const prevSelected = roomSelect.value;
  
  roomSelect.innerHTML = '<option value="">-- Choose Room / Teacher --</option>';
  massRoomVal.innerHTML = '<option value="">-- Choose New Room --</option>';

  locationDirectory.forEach((item, index) => {
    const label = `${item["Room No."]} - ${item["Teacher"]} (${item["Class"]})`;
    const opt1 = new Option(label, index);
    const opt2 = new Option(label, index);
    roomSelect.add(opt1);
    massRoomVal.add(opt2);
  });

  if (prevSelected && locationDirectory[prevSelected]) {
    roomSelect.value = prevSelected;
  }
}

function syncLocationDetails() {
  const selectedIndex = document.getElementById('roomSelect').value;
  if (selectedIndex !== "") {
    const item = locationDirectory[selectedIndex];
    document.getElementById('teacherDisplay').value = item["Teacher"];
    document.getElementById('classDisplay').value = item["Class"];
  } else {
    document.getElementById('teacherDisplay').value = "";
    document.getElementById('classDisplay').value = "";
  }
}

// Scanner Input Handling
const scanInput = document.getElementById('scanInput');
let scanTimer = null;

scanInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  if (/^\d{6}$/.test(val)) {
    clearTimeout(scanTimer);
    handleScanSubmit();
  }
});

scanInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleScanSubmit();
  }
});

async function handleScanSubmit() {
  const rawTag = scanInput.value.trim();
  const roomIdx = document.getElementById('roomSelect').value;
  const cartTag = document.getElementById('cartAssetTag').value.trim();
  const feedback = document.getElementById('scanFeedback');

  if (!rawTag) {
    feedback.innerHTML = '<span class="status-warn">Scan input is empty.</span>';
    scanInput.focus();
    return;
  }

  if (roomIdx === "") {
    feedback.innerHTML = '<span class="status-warn">Please select a Room No. before scanning.</span>';
    scanInput.focus();
    return;
  }

  const loc = locationDirectory[roomIdx];
  const newId = Date.now().toString() + "_" + rawTag;
  const record = {
    assetTag: rawTag,
    roomNo: loc["Room No."],
    teacher: loc["Teacher"],
    className: loc["Class"],
    cartAssetTag: cartTag,
    notes: "",
    timestamp: Date.now()
  };

  try {
    if (isCloudReady) {
      await window.fs.setDoc(window.fs.doc(window.db, "inventory", newId), record);
    } else {
      // Fallback
      inventory.unshift({ id: newId, ...record });
      renderTable();
    }
    feedback.innerHTML = `<span class="status-ok">Recorded Asset #${rawTag} &rarr; Room ${loc["Room No."]} (${loc["Teacher"]})</span>`;
    scanInput.value = '';
    scanInput.focus();
  } catch (err) {
    feedback.innerHTML = `<span class="status-warn">Cloud error: ${err.message}</span>`;
  }
}

function renderTable() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const tbody = document.getElementById('inventoryBody');
  tbody.innerHTML = '';

  const filtered = inventory.filter(item => {
    if (!query) return true;
    return (item.teacher && item.teacher.toLowerCase().includes(query)) ||
           (item.roomNo && item.roomNo.toLowerCase().includes(query)) ||
           (item.assetTag && item.assetTag.toLowerCase().includes(query));
  });

  filtered.forEach(item => {
    const isChecked = selectedDocIds.has(item.id);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;"><input type="checkbox" onchange="toggleSelect('${item.id}', this.checked)" ${isChecked ? 'checked' : ''}></td>
      <td><input class="editable-input" value="${escapeHtml(item.assetTag)}" onchange="updateRowField('${item.id}', 'assetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.roomNo)}" onchange="updateRowField('${item.id}', 'roomNo', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.teacher)}" onchange="updateRowField('${item.id}', 'teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.className)}" onchange="updateRowField('${item.id}', 'className', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.cartAssetTag)}" onchange="updateRowField('${item.id}', 'cartAssetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.notes)}" placeholder="Tap to add notes..." onchange="updateRowField('${item.id}', 'notes', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteRow('${item.id}')">Del</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateMassBar();
}

async function updateRowField(docId, field, value) {
  if (!isCloudReady) return;
  try {
    const docRef = window.fs.doc(window.db, "inventory", docId);
    await window.fs.updateDoc(docRef, { [field]: value });
  } catch (e) {
    console.error("Update error:", e);
  }
}

async function deleteRow(docId) {
  if (!isCloudReady) return;
  try {
    await window.fs.deleteDoc(window.fs.doc(window.db, "inventory", docId));
    selectedDocIds.delete(docId);
  } catch (e) {
    console.error("Delete error:", e);
  }
}

function toggleSelect(docId, isChecked) {
  if (isChecked) selectedDocIds.add(docId);
  else selectedDocIds.delete(docId);
  updateMassBar();
}

function toggleSelectAll(isChecked) {
  if (isChecked) {
    inventory.forEach(item => selectedDocIds.add(item.id));
  } else {
    selectedDocIds.clear();
  }
  renderTable();
}

function updateMassBar() {
  const bar = document.getElementById('massUpdateBar');
  const countSpan = document.getElementById('selectedCount');
  countSpan.innerText = selectedDocIds.size;
  bar.style.display = selectedDocIds.size > 0 ? 'flex' : 'none';
  document.getElementById('selectAll').checked = (inventory.length > 0 && selectedDocIds.size === inventory.length);
}

function toggleMassInput() {
  const field = document.getElementById('massField').value;
  document.getElementById('massRoomVal').style.display = field === 'room' ? 'inline-block' : 'none';
  document.getElementById('massTextVal').style.display = field !== 'room' ? 'inline-block' : 'none';
}

async function applyMassUpdate() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  const field = document.getElementById('massField').value;
  const batch = window.fs.writeBatch(window.db);

  if (field === 'room') {
    const locIdx = document.getElementById('massRoomVal').value;
    if (locIdx === "") return;
    const loc = locationDirectory[locIdx];
    selectedDocIds.forEach(id => {
      const ref = window.fs.doc(window.db, "inventory", id);
      batch.update(ref, {
        roomNo: loc["Room No."],
        teacher: loc["Teacher"],
        className: loc["Class"]
      });
    });
  } else if (field === 'cart') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { cartAssetTag: val });
    });
  } else if (field === 'notes') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { notes: val });
    });
  }

  await batch.commit();
}

async function deleteSelected() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  if (!confirm(`Delete ${selectedDocIds.size} selected record(s) from cloud?`)) return;

  const batch = window.fs.writeBatch(window.db);
  selectedDocIds.forEach(id => {
    batch.delete(window.fs.doc(window.db, "inventory", id));
  });
  await batch.commit();
  selectedDocIds.clear();
}

/* Location Directory Management */
function openLocationManager() {
  renderLocationList();
  document.getElementById('locationModal').classList.add('active');
}

function closeLocationManager() {
  document.getElementById('locationModal').classList.remove('active');
  syncLocationDetails();
}

function renderLocationList() {
  const tbody = document.getElementById('locationListBody');
  tbody.innerHTML = '';
  locationDirectory.forEach((loc, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="editable-input" value="${escapeHtml(loc["Room No."])}" onchange="updateLocationField(${idx}, 'Room No.', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Teacher"])}" onchange="updateLocationField(${idx}, 'Teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Class"])}" onchange="updateLocationField(${idx}, 'Class', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteLocation(${idx})">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function saveLocationsCloud() {
  if (!isCloudReady) return;
  await window.fs.setDoc(window.fs.doc(window.db, "config", "locations"), { list: locationDirectory });
  initDropdowns();
}

async function addNewLocation() {
  const room = document.getElementById('newRoomNo').value.trim();
  const teacher = document.getElementById('newTeacher').value.trim();
  const cls = document.getElementById('newClass').value.trim();

  if (!room || !teacher) {
    alert("Please provide at least a Room No. and Teacher name.");
    return;
  }

  locationDirectory.unshift({
    "Room No.": room,
    "Teacher": teacher,
    "Class": cls || "General"
  });

  await saveLocationsCloud();
  renderLocationList();

  document.getElementById('newRoomNo').value = '';
  document.getElementById('newTeacher').value = '';
  document.getElementById('newClass').value = '';
}

async function updateLocationField(index, field, value) {
  if (locationDirectory[index]) {
    locationDirectory[index][field] = value;
    await saveLocationsCloud();
  }
}

async function deleteLocation(index) {
  if (confirm(`Remove room ${locationDirectory[index]["Room No."]} (${locationDirectory[index]["Teacher"]})?`)) {
    locationDirectory.splice(index, 1);
    await saveLocationsCloud();
    renderLocationList();
  }
}

async function resetLocationsToDefault() {
  if (confirm("Reset the location directory back to the original spreadsheet data? Any custom rooms you added will be removed.")) {
    locationDirectory = JSON.parse(JSON.stringify(defaultLocationDirectory));
    await saveLocationsCloud();
    renderLocationList();
  }
}

function exportData(format) {
  if (inventory.length === 0) {
    alert("Repository is empty.");
    return;
  }

  let content = "";
  let filename = `asset_inventory_${new Date().toISOString().slice(0,10)}`;
  let mimeType = "";

  if (format === 'json') {
    content = JSON.stringify(inventory.map(({assetTag, roomNo, teacher, className, cartAssetTag, notes}) => ({
      "Asset Tag": assetTag,
      "Room No.": roomNo,
      "Teacher": teacher,
      "Class": className,
      "Cart Asset Tag": cartAssetTag,
      "Notes": notes
    })), null, 2);
    filename += ".json";
    mimeType = "application/json";
  } else {
    const headers = ["Asset Tag", "Room No.", "Teacher", "Class", "Cart Asset Tag", "Notes"];
    const rows = inventory.map(item => [
      `"${item.assetTag || ''}"`,
      `"${item.roomNo || ''}"`,
      `"${(item.teacher || '').replace(/"/g, '""')}"`,
      `"${(item.className || '').replace(/"/g, '""')}"`,
      `"${item.cartAssetTag || ''}"`,
      `"${(item.notes || '').replace(/"/g, '""')}"`
    ]);
    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    filename += ".csv";
    mimeType = "text/csv;charset=utf-8;";
  }

  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

window.onload = () => {
  initDropdowns();
};
</script>
