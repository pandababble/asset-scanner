  window.fs.onSnapshot(invCol, (snapshot) => {
    statusEl.className = 'sync-status online';
    statusEl.innerHTML = '<span class="sync-dot"></span> Cloud Live';

    inventory = [];
    snapshot.forEach(docSnap => {
      inventory.push({ id: docSnap.id, ...docSnap.data() });
    });
    inventory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    updateRoomFilterDropdown();
    renderTable();
  }, (err) => {
    statusEl.className = 'sync-status error';
    statusEl.innerHTML = '<span class="sync-dot"></span> Sync Blocked';
    document.getElementById('scanFeedback').innerHTML = 
      `<span class="status-warn">Cloud Permission Denied: Check Firestore Security Rules! (${err.message})</span>`;
  });

  const locDoc = window.fs.doc(window.db, "config", "locations");
  window.fs.onSnapshot(locDoc, (docSnap) => {
    if (docSnap.exists() && Array.isArray(docSnap.data().list)) {
      locationDirectory = docSnap.data().list;
    } else {
      window.fs.setDoc(locDoc, { list: defaultLocationDirectory }).catch(err => {
        console.warn("Initial seed error:", err.message);
      });
      locationDirectory = defaultLocationDirectory;
    }
    initDropdowns();
    renderLocationList();
  }, (err) => {
    console.warn("Location sync denied:", err.message);
  });
});

function initDropdowns() {
  const roomSelect = document.getElementById('roomSelect');
  const massRoomVal = document.getElementById('massRoomVal');
  const prevSelected = roomSelect.value;
  
  roomSelect.innerHTML = '<option value="">-- Choose Room / Teacher --</option>';
  massRoomVal.innerHTML = '<option value="">-- Choose New Room --</option>';

  locationDirectory.forEach((item, index) => {
    const label = `${item["Room No."]} - ${item["Teacher"]} (${item["Class"]})`;
    const opt1 = new Option(label, index);
    const opt2 = new Option(label, index);
    roomSelect.add(opt1);
    massRoomVal.add(opt2);
  });

  if (prevSelected && locationDirectory[prevSelected]) {
    roomSelect.value = prevSelected;
  }
}

function updateRoomFilterDropdown() {
  const filterSelect = document.getElementById('filterRoomSelect');
  const currentVal = filterSelect.value;

  const roomCounts = {};
  inventory.forEach(item => {
    const r = (item.roomNo || "Unassigned").trim();
    roomCounts[r] = (roomCounts[r] || 0) + 1;
  });

  const sortedRooms = Object.keys(roomCounts).sort();

  filterSelect.innerHTML = '<option value="">All Rooms</option>';
  sortedRooms.forEach(room => {
    const opt = new Option(`${room} (${roomCounts[room]})`, room);
    filterSelect.add(opt);
  });

  if (sortedRooms.includes(currentVal)) {
    filterSelect.value = currentVal;
  }
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterRoomSelect').value = '';
  renderTable();
}

function syncLocationDetails() {
  const selectedIndex = document.getElementById('roomSelect').value;
  if (selectedIndex !== "") {
    const item = locationDirectory[selectedIndex];
    document.getElementById('teacherDisplay').value = item["Teacher"];
    document.getElementById('classDisplay').value = item["Class"];
  } else {
    document.getElementById('teacherDisplay').value = "";
    document.getElementById('classDisplay').value = "";
  }
}

const scanInput = document.getElementById('scanInput');
let scanTimer = null;

scanInput.addEventListener('input', (e) => {
  const val = e.target.value.trim();
  if (/^\d{6}$/.test(val)) {
    clearTimeout(scanTimer);
    handleScanSubmit();
  }
});

scanInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleScanSubmit();
  }
});

// Queries Incident IQ through your Cloudflare Worker relay
async function fetchIiqAssetDetails(assetTag) {
  try {
    const res = await fetch(IIQ_WORKER_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ assetTag: String(assetTag).trim() })
    });

    if (!res.ok) return null;
    const json = await res.json();

    if (json.Items && json.Items.length > 0) {
      const a = json.Items[0];
      const serial = a.SerialNumber || "";
      const model = a.ModelName || (a.Model && a.Model.Name) || "";
      
      return {
        serialNumber: serial,
        model: model,
        iiqAssignee: serial // Display serial number under iiQ Assignee column
      };
    }
  } catch (err) {
    console.warn("Worker proxy lookup error:", err.message);
  }
  return null;
}

async function handleScanSubmit() {
  const rawTag = scanInput.value.trim();
  const roomIdx = document.getElementById('roomSelect').value;
  const cartTag = document.getElementById('cartAssetTag').value.trim();
  const feedback = document.getElementById('scanFeedback');

  if (!rawTag) {
    feedback.innerHTML = '<span class="status-warn">Scan input is empty.</span>';
    scanInput.focus();
    return;
  }

  if (roomIdx === "") {
    feedback.innerHTML = '<span class="status-warn">Please select a Room No. before scanning.</span>';
    scanInput.focus();
    return;
  }

  feedback.innerHTML = `<span>Querying Incident IQ for #${rawTag}...</span>`;

  // Fetch device details from Incident IQ
  const iiqData = await fetchIiqAssetDetails(rawTag);

  const loc = locationDirectory[roomIdx];
  const newId = Date.now().toString() + "_" + rawTag;

  const foundSerial = (iiqData && iiqData.serialNumber) ? iiqData.serialNumber : "";
  const foundModel = (iiqData && iiqData.model) ? iiqData.model : "";
  const foundAssignee = (iiqData && iiqData.iiqAssignee) ? iiqData.iiqAssignee : foundSerial;

  const record = {
    assetTag: rawTag,
    serialNumber: foundSerial,
    model: foundModel,
    iiqAssignee: foundAssignee,
    roomNo: loc["Room No."],
    teacher: loc["Teacher"],
    className: loc["Class"],
    cartAssetTag: cartTag,
    notes: "",
    timestamp: Date.now()
  };

  try {
    if (isCloudReady) {
      await window.fs.setDoc(window.fs.doc(window.db, "inventory", newId), record);
      const iiqInfo = foundSerial ? ` [S/N: ${foundSerial} | ${foundModel}]` : '';
      feedback.innerHTML = `<span class="status-ok">Recorded #${rawTag}${iiqInfo} &rarr; Room ${loc["Room No."]} (${loc["Teacher"]})</span>`;
    } else {
      feedback.innerHTML = `<span class="status-warn">Cloud not connected yet. Check network.</span>`;
    }
    scanInput.value = '';
    scanInput.focus();
  } catch (err) {
    feedback.innerHTML = `<span class="status-warn">Cloud write failed: ${err.message}</span>`;
  }
}

function renderTable() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const selectedRoomFilter = document.getElementById('filterRoomSelect').value.trim();
  const tbody = document.getElementById('inventoryBody');
  tbody.innerHTML = '';

  const filtered = inventory.filter(item => {
    if (selectedRoomFilter && (item.roomNo || '').trim() !== selectedRoomFilter) {
      return false;
    }
    if (query) {
      const matchTeacher = item.teacher && item.teacher.toLowerCase().includes(query);
      const matchRoom = item.roomNo && item.roomNo.toLowerCase().includes(query);
      const matchTag = item.assetTag && item.assetTag.toLowerCase().includes(query);
      const matchSerial = item.serialNumber && item.serialNumber.toLowerCase().includes(query);
      const matchModel = item.model && item.model.toLowerCase().includes(query);
      const matchAssignee = item.iiqAssignee && item.iiqAssignee.toLowerCase().includes(query);
      const matchNotes = item.notes && item.notes.toLowerCase().includes(query);
      if (!matchTeacher && !matchRoom && !matchTag && !matchSerial && !matchModel && !matchAssignee && !matchNotes) return false;
    }
    return true;
  });

  const countBadge = document.getElementById('assetCount');
  if (selectedRoomFilter || query) {
    countBadge.innerText = `${filtered.length} / ${inventory.length} Records`;
  } else {
    countBadge.innerText = `${inventory.length} Records`;
  }

  filtered.forEach(item => {
    const isChecked = selectedDocIds.has(item.id);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;"><input type="checkbox" onchange="toggleSelect('${item.id}', this.checked)" ${isChecked ? 'checked' : ''}></td>
      <td><input class="editable-input" value="${escapeHtml(item.assetTag)}" onchange="updateRowField('${item.id}', 'assetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.serialNumber || '')}" placeholder="--" onchange="updateRowField('${item.id}', 'serialNumber', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.model || '')}" placeholder="--" onchange="updateRowField('${item.id}', 'model', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.roomNo)}" onchange="updateRowField('${item.id}', 'roomNo', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.teacher)}" onchange="updateRowField('${item.id}', 'teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.className)}" onchange="updateRowField('${item.id}', 'className', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.cartAssetTag)}" onchange="updateRowField('${item.id}', 'cartAssetTag', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.iiqAssignee || '')}" placeholder="--" onchange="updateRowField('${item.id}', 'iiqAssignee', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(item.notes)}" placeholder="Tap to add notes..." onchange="updateRowField('${item.id}', 'notes', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteRow('${item.id}')">Del</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateMassBar();
}

async function updateRowField(docId, field, value) {
  if (!isCloudReady) return;
  try {
    const docRef = window.fs.doc(window.db, "inventory", docId);
    await window.fs.updateDoc(docRef, { [field]: value });
  } catch (e) {
    document.getElementById('scanFeedback').innerHTML = `<span class="status-warn">Update failed: ${e.message}</span>`;
  }
}

async function deleteRow(docId) {
  if (!isCloudReady) return;
  try {
    await window.fs.deleteDoc(window.fs.doc(window.db, "inventory", docId));
    selectedDocIds.delete(docId);
  } catch (e) {
    document.getElementById('scanFeedback').innerHTML = `<span class="status-warn">Delete failed: ${e.message}</span>`;
  }
}

function toggleSelect(docId, isChecked) {
  if (isChecked) selectedDocIds.add(docId);
  else selectedDocIds.delete(docId);
  updateMassBar();
}

function toggleSelectAll(isChecked) {
  if (isChecked) {
    inventory.forEach(item => selectedDocIds.add(item.id));
  } else {
    selectedDocIds.clear();
  }
  renderTable();
}

function updateMassBar() {
  const bar = document.getElementById('massUpdateBar');
  const countSpan = document.getElementById('selectedCount');
  countSpan.innerText = selectedDocIds.size;
  bar.style.display = selectedDocIds.size > 0 ? 'flex' : 'none';
  document.getElementById('selectAll').checked = (inventory.length > 0 && selectedDocIds.size === inventory.length);
}

function toggleMassInput() {
  const field = document.getElementById('massField').value;
  document.getElementById('massRoomVal').style.display = field === 'room' ? 'inline-block' : 'none';
  document.getElementById('massTextVal').style.display = field !== 'room' ? 'inline-block' : 'none';
}

async function applyMassUpdate() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  const field = document.getElementById('massField').value;
  const batch = window.fs.writeBatch(window.db);

  if (field === 'room') {
    const locIdx = document.getElementById('massRoomVal').value;
    if (locIdx === "") return;
    const loc = locationDirectory[locIdx];
    selectedDocIds.forEach(id => {
      const ref = window.fs.doc(window.db, "inventory", id);
      batch.update(ref, {
        roomNo: loc["Room No."],
        teacher: loc["Teacher"],
        className: loc["Class"]
      });
    });
  } else if (field === 'cart') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { cartAssetTag: val });
    });
  } else if (field === 'notes') {
    const val = document.getElementById('massTextVal').value;
    selectedDocIds.forEach(id => {
      batch.update(window.fs.doc(window.db, "inventory", id), { notes: val });
    });
  }

  await batch.commit();
}

async function deleteSelected() {
  if (selectedDocIds.size === 0 || !isCloudReady) return;
  if (!confirm(`Delete ${selectedDocIds.size} selected record(s) from cloud?`)) return;

  const batch = window.fs.writeBatch(window.db);
  selectedDocIds.forEach(id => {
    batch.delete(window.fs.doc(window.db, "inventory", id));
  });
  await batch.commit();
  selectedDocIds.clear();
}

function openLocationManager() {
  selectedLocIndices.clear();
  renderLocationList();
  document.getElementById('locationModal').classList.add('active');
}

function closeLocationManager() {
  document.getElementById('locationModal').classList.remove('active');
  selectedLocIndices.clear();
  syncLocationDetails();
}

function renderLocationList() {
  const tbody = document.getElementById('locationListBody');
  tbody.innerHTML = '';
  document.getElementById('locTotalCount').innerText = locationDirectory.length;

  locationDirectory.forEach((loc, idx) => {
    const isChecked = selectedLocIndices.has(idx);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;">
        <input type="checkbox" onchange="toggleSelectLocation(${idx}, this.checked)" ${isChecked ? 'checked' : ''}>
      </td>
      <td><input class="editable-input" value="${escapeHtml(loc["Room No."])}" onchange="updateLocationField(${idx}, 'Room No.', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Teacher"])}" onchange="updateLocationField(${idx}, 'Teacher', this.value)"></td>
      <td><input class="editable-input" value="${escapeHtml(loc["Class"])}" onchange="updateLocationField(${idx}, 'Class', this.value)"></td>
      <td style="text-align:center;">
        <button class="btn-danger row-action" onclick="deleteLocation(${idx})">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  updateLocSelectionUI();
}

function toggleSelectLocation(idx, isChecked) {
  if (isChecked) selectedLocIndices.add(idx);
  else selectedLocIndices.delete(idx);
  updateLocSelectionUI();
}

function toggleSelectAllLocations(isChecked) {
  if (isChecked) {
    locationDirectory.forEach((_, idx) => selectedLocIndices.add(idx));
  } else {
    selectedLocIndices.clear();
  }
  renderLocationList();
}

function updateLocSelectionUI() {
  const btnDeleteSelected = document.getElementById('btnDeleteSelectedRooms');
  const countSpan = document.getElementById('locSelectedCount');
  const selectAllBox = document.getElementById('selectAllLocations');

  countSpan.innerText = selectedLocIndices.size;
  btnDeleteSelected.style.display = selectedLocIndices.size > 0 ? 'inline-flex' : 'none';

  if (selectAllBox) {
    selectAllBox.checked = locationDirectory.length > 0 && selectedLocIndices.size === locationDirectory.length;
  }
}

async function deleteSelectedLocations() {
  if (selectedLocIndices.size === 0) return;
  if (!confirm(`Delete ${selectedLocIndices.size} selected room location(s) from cloud?`)) return;

  locationDirectory = locationDirectory.filter((_, idx) => !selectedLocIndices.has(idx));
  selectedLocIndices.clear();
  await saveLocationsCloud();
  renderLocationList();
}

async function saveLocationsCloud() {
  if (!isCloudReady) return;
  await window.fs.setDoc(window.fs.doc(window.db, "config", "locations"), { list: locationDirectory });
  initDropdowns();
}

async function addNewLocation() {
  const room = document.getElementById('newRoomNo').value.trim();
  const teacher = document.getElementById('newTeacher').value.trim();
  const cls = document.getElementById('newClass').value.trim();

  if (!room || !teacher) {
    alert("Please provide at least a Room No. and Teacher name.");
    return;
  }

  locationDirectory.unshift({
    "Room No.": room,
    "Teacher": teacher,
    "Class": cls || "General"
  });

  await saveLocationsCloud();
  renderLocationList();

  document.getElementById('newRoomNo').value = '';
  document.getElementById('newTeacher').value = '';
  document.getElementById('newClass').value = '';
}

async function updateLocationField(index, field, value) {
  if (locationDirectory[index]) {
    locationDirectory[index][field] = value;
    await saveLocationsCloud();
  }
}

async function deleteLocation(index) {
  if (confirm(`Remove room ${locationDirectory[index]["Room No."]} (${locationDirectory[index]["Teacher"]})?`)) {
    locationDirectory.splice(index, 1);
    selectedLocIndices.delete(index);
    await saveLocationsCloud();
    renderLocationList();
  }
}

async function resetLocationsToDefault() {
  if (confirm("Reset the location directory back to the original spreadsheet data?")) {
    locationDirectory = JSON.parse(JSON.stringify(defaultLocationDirectory));
    selectedLocIndices.clear();
    await saveLocationsCloud();
    renderLocationList();
  }
}

function exportData(format) {
  if (inventory.length === 0) {
    alert("Repository is empty.");
    return;
  }

  let content = "";
  let filename = `asset_inventory_${new Date().toISOString().slice(0,10)}`;
  let mimeType = "";

  if (format === 'json') {
    content = JSON.stringify(inventory.map(({assetTag, serialNumber, model, roomNo, teacher, className, cartAssetTag, iiqAssignee, notes}) => ({
      "Asset Tag": assetTag,
      "Serial Number": serialNumber || "",
      "Model": model || "",
      "Room No.": roomNo,
      "Teacher": teacher,
      "Class": className,
      "Cart Asset Tag": cartAssetTag,
      "iiQ Assignee": iiqAssignee || "",
      "Notes": notes
    })), null, 2);
    filename += ".json";
    mimeType = "application/json";
  } else {
    const headers = ["Asset Tag", "Serial Number", "Model", "Room No.", "Teacher", "Class", "Cart Asset Tag", "iiQ Assignee", "Notes"];
    const rows = inventory.map(item => [
      `"${item.assetTag || ''}"`,
      `"${item.serialNumber || ''}"`,
      `"${item.model || ''}"`,
      `"${item.roomNo || ''}"`,
      `"${(item.teacher || '').replace(/"/g, '""')}"`,
      `"${(item.className || '').replace(/"/g, '""')}"`,
      `"${item.cartAssetTag || ''}"`,
      `"${(item.iiqAssignee || '').replace(/"/g, '""')}"`,
      `"${(item.notes || '').replace(/"/g, '""')}"`
    ]);
    content = [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
    filename += ".csv";
    mimeType = "text/csv;charset=utf-8;";
  }

  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

window.onload = () => {
  initDropdowns();
};
</script>
